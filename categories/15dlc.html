<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/png" href="../assets/ico.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">

    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'BebasNeue';
            src: url('../assets/BebasNeue-Regular.woff2') format('woff2'),
                url('../assets/BebasNeue-Regular.woff') format('woff');
        }

        @font-face {
            font-family: 'WarowniaBd';
            src: url('../assets/WarowniaBd.woff') format('woff2'),
                url('../assets/WarowniaBd.woff') format('woff');
        }

        @font-face {
            font-family: 'Mackay';
            src: url('../assets/Rene\ Bieder\ -\ Mackay\ DEMO\ Bold.woff2') format('woff2');
        }

        /* Reset e básico */
        body {
            margin: 0;
            height: 100vh;
            background-color: #080b0e;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        .navico {
            filter: brightness(15%);
        }

        .navico:hover {
            filter: brightness(0) saturate(100%) invert(75%) sepia(15%) saturate(5844%) hue-rotate(321deg) brightness(107%) contrast(112%);

        }

        .navico1 {
            filter: brightness(75%);
        }

        .navico1:hover {
            filter: brightness(0) saturate(100%) invert(75%) sepia(15%) saturate(5844%) hue-rotate(321deg) brightness(107%) contrast(112%);

        }

        .bg-dark {
            background-color: #080b0e !important;

        }

        .nav-link {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-transform: uppercase;
            color: rgb(202, 202, 202);
            font-size: 20px;
        }

        .nav-link:hover {
            color: #ff975b;
        }

        #smooth {
            transition: opacity 1s ease;
        }


        .title {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            margin-top: 90px;
            color: #ff975b;
            font-weight: bold;
            font-family: 'BebasNeue';
            font-size: 90px;
            letter-spacing: 4px;

        }

        .title2 {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            margin-top: 0px;
            color: #ffffff;
            font-weight: bold;
            font-family: 'BebasNeue';
            font-size: 40px;
            letter-spacing: 4px;
        }


        /* Container para cards, centralizado, abaixo da navbar */
        main.card-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 56px);
            padding-top: 56px;
            perspective: 1500px;
            margin-top: -190px;
        }

        /* Card padrão */
        .card {
            width: 300px;
            height: 420px;
            overflow: hidden;
            position: relative;
            background-color: #202020;
            transform-style: preserve-3d;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        /* Brilho */
        .shine-effect {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 300%;
            height: 200%;
            background: linear-gradient(130deg,
                    rgba(255, 255, 255, 0) 45%,
                    rgba(255, 255, 255, 0.25) 50%,
                    rgba(255, 255, 255, 0) 55%);
            mix-blend-mode: screen;
            pointer-events: none;
            border-radius: 12px;
            transform: translate(0, 0);
            transition: transform 0.2s ease;
        }

        /* Fundo fixo */
        #fundo img {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            object-fit: cover;
        }

        /* ------------------------------
   Borda animada (gradiente giratório)
   aplicada ao card selecionado
   ------------------------------ */

        /* registra a propriedade --bg-angle para que a animação funcione */
        @property --bg-angle {
            inherits: false;
            initial-value: 0deg;
            syntax: "<angle>";
        }

        /* animação que gira a variável --bg-angle */
        @keyframes spin {
            to {
                --bg-angle: 360deg;
            }
        }

        /* estilo do card selecionado: cria um "border" com dois backgrounds
   (padding-box para o conteúdo e border-box para a borda animada) */
        .card.stroke-selecionado {
            /* importante manter posição relativa (já existe) */
            position: relative;

            /* background do conteúdo (mantemos cor escura do card no padding-box) */
            background:
                /* background interno (conteúdo) */
                linear-gradient(to bottom,
                    oklch(0.07 0.02 240 / 1),
                    oklch(0.07 0.02 240 / 1)) padding-box,
                /* gradiente de borda animado */
                conic-gradient(from var(--bg-angle), #ff975b 0deg, #0084ff00 80deg, #0084ff00 160deg, #ff975b 260deg, #ffffff 285deg, #ff975b 340deg) border-box;

            /* borda transparente para o gradiente aparecer */
            border: 4px solid transparent;

            /* garante que a borda acompanhe os cantos do card (caso tenha radius) */
            box-sizing: border-box;

            /* quando a classe estiver presente, dispara a animação */
            animation: spin 5.5s linear infinite;
        }

        /* opcional: se quiser pausar a animação ao não estar selecionado, remova esta regra.
   Estamos configurando para rodar enquanto o card tiver .stroke-selecionado */
        /* Ao focar ou hover no card selecionado a animação continua (não há pausa). */

        /* para suavizar a entrada da borda (opcional) */
        .card.stroke-selecionado {
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-md bg-dark sticky-top border-bottom" data-bs-theme="dark">
        <div class="container">
            <div class="offcanvas-body">
                <ul class="navbar-nav flex-grow-1 justify-content-between">
                    <li class="nav-item"><a class="nav-link" href="14gamedesign.html"><i
                                class="bi bi-arrow-left"></i></a></li>
                    <li class="nav-item"><a class="nav-link" href="../pages/categorias.html">VER MAIS CATEGORIAS</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="16piorjogo.html"><i
                                class="bi bi-arrow-right"></i></a></li>

                </ul>
            </div>
        </div>
        </div>
    </nav>
    <div id="smooth">
        <h1 class="title">MELHOR DLC/UPDATE</h1>
        <h1 class="title2">VEJA OS NOMEADOS DE 2025</h1>
        <main class="card-container">
            <div class="card" onclick="enviarVoto('LiesOfP')">
                <img src="../assets/imagens/lies of p.png" alt="LiesOfP" />
                <div class="shine-effect"></div>
            </div>
            <div class="card" onclick="enviarVoto('IndianaJones')">
                <img src="../assets/imagens/indiana jones.png" alt="IndianaJones" />
                <div class="shine-effect"></div>
            </div>
            <div class="card" onclick="enviarVoto('Lethalcompany')">
                <img src="../assets/imagens/lethalcompany.png" alt="Lethalcompany" />
                <div class="shine-effect"></div>
            </div>
            <div class="card" onclick="enviarVoto('BaldursGate')">
                <img src="../assets/imagens/bladurs gate.png" alt="BaldursGate" />
                <div class="shine-effect"></div>
            </div>
            <div class="card" onclick="enviarVoto('NoMansSky')">
                <img src="../assets/imagens/no mans sky.png" alt="NoMansSky" />
                <div class="shine-effect"></div>
            </div>
        </main>
    </div>
    <div id="fundo">
        <img src="../assets/vote-background.png" alt="Background" />
    </div>

    <script>
        var smooth = document.getElementById('smooth');
        smooth.style.opacity = 0;
        document.addEventListener("DOMContentLoaded", function () {
            setTimeout(() => {
                smooth.style.opacity = 100;
            }, 500); // Espera 1.5 segundos antes de alterar a opacidade
        });


        // ----------------------------
        // SISTEMA DE VOTAÇÃO AXULÉIA 2025
        // ----------------------------
        const chaveVoto = "axuleia_votou_DLC";

        // FORM RESPONSE CORRETO DO LINK QUE VOCÊ ENVIOU
        const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSe5T9n_vxyzD6pW9QoH3jCR9rp3cK9LDxvkOrvOgCx19CuXjA/formResponse";

        // ENTRY CORRETO
        const entryID = "entry.1281458119";

         // Aplica o fade aos cards (sem mexer na estética original)
        function aplicarFade() {
            document.querySelectorAll(".card").forEach(card => {
                // pega a transition inline se houver, senão pega a computada (CSS)
                const existing = card.style.transition && card.style.transition.trim().length ? card.style.transition : getComputedStyle(card).transition || '';

                // separa em partes individuais
                const parts = existing.split(',').map(p => p.trim()).filter(p => p.length);

                // helper pra checar se já existe uma transição para uma propriedade
                const has = prop => parts.some(p => p.indexOf(prop) !== -1);

                // adiciona transform caso não exista (usa uma duração curta, compatível com seu hover)
                if (!has('transform')) parts.push('transform 0.2s ease');

                // adiciona filter e opacity se não existirem
                if (!has('filter')) parts.push('filter 0.6s ease');
                if (!has('opacity')) parts.push('opacity 0.6s ease');

                // atribui de volta, juntando com vírgula
                card.style.transition = parts.join(', ');
            });
        }

        // Aplica estado pós-voto
        function aplicarFiltroPosVoto(opcaoVotada) {
            aplicarFade(); // garante fade antes da troca

            document.querySelectorAll(".card").forEach(card => {
                const nome = card.querySelector("img").alt || "";

                card.style.pointerEvents = "none";

                if (nome === opcaoVotada) {
                    card.style.filter = "none";
                    card.style.opacity = "1";
                } else {
                    card.style.filter = "grayscale(100%)";
                    card.style.opacity = "0.5";
                }
            });
        }

        // Enviar voto
        function enviarVoto(opcao) {
            if (localStorage.getItem(chaveVoto)) return;

            const url = `${formURL}?${entryID}=${encodeURIComponent(opcao)}`;

            fetch(url, { method: "POST", mode: "no-cors" }).catch(() => { });

            localStorage.setItem(chaveVoto, opcao);

            aplicarFiltroPosVoto(opcao);
            aplicarStrokeSelecionado(opcao);

        }

        // Ao carregar a página
        document.addEventListener("DOMContentLoaded", () => {
            const votoSalvo = localStorage.getItem(chaveVoto);

            // já votou? aplicar estado imediatamente
            if (votoSalvo) {
                aplicarFiltroPosVoto(votoSalvo);
                aplicarStrokeSelecionado(votoSalvo);
            } else {
                aplicarFade(); // garante que, quando votar, o fade exista
            }

            // garante onclick
            document.querySelectorAll(".card").forEach(card => {
                if (!card.dataset.listenerAttached) {
                    const nome = card.querySelector("img")?.alt || "";
                    card.addEventListener("click", () => enviarVoto(nome));
                    card.dataset.listenerAttached = "1";
                }
            });
        });

        function aplicarStrokeSelecionado(opcaoVotada) {
            document.querySelectorAll(".card").forEach(card => {
                const nome = card.querySelector("img").alt;

                card.classList.remove("stroke-selecionado");

                if (nome === opcaoVotada) {
                    card.classList.add("stroke-selecionado");
                }
            });
        }

        document.querySelectorAll('.card').forEach((card) => {
            const shine = card.querySelector('.shine-effect');

            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = ((y - centerY) / centerY) * -25;
                const rotateY = ((x - centerX) / centerX) * 25;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.08)`;

                const shineX = rotateY * 2.5;
                const shineY = rotateX * -2.5;
                shine.style.transform = `translate(${shineX}px, ${shineY}px)`;

                const shadowX = rotateY * -3;
                const shadowY = rotateX * 3;
                card.style.boxShadow = `${shadowX}px ${shadowY}px 40px rgba(0, 0, 0, 0.5)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
                shine.style.transform = `translate(0px, 0px)`;
                card.style.boxShadow = `0px 10px 30px rgba(0, 0, 0, 0.3)`;
            });
        });
    </script>
</body>

</html>
